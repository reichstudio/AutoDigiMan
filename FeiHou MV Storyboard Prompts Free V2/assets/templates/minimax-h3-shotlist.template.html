<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniMax H3 全片分镜提示词</title><style>
:root{--bg:#060914;--panel:#10172a;--line:#30456d;--ink:#eff6ff;--muted:#aebbd3;--cyan:#5ce5f5;--gold:#ffd36a;--violet:#7653a8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font:14px/1.65 Inter,"Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#11172d 0,#0a1020 33vh,#060914 190vh)}header{padding:40px max(32px,calc((100vw - 1240px)/2));background:linear-gradient(90deg,#14213d,#272046 54%,#33224c);border-bottom:1px solid #43517d}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.04em;font-size:17px}h1{margin:4px 0 8px;font-size:clamp(31px,4vw,53px);line-height:1.12}.sub{color:var(--muted);font-size:16px}.metrics{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.metric,.pill,.ref,.type{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:#0a1020}.metric b{color:var(--gold)}main{max-width:1240px;margin:0 auto;padding:28px 24px 80px}.panel,.shot{background:rgba(16,23,42,.92);border:1px solid var(--line);border-radius:14px}.panel{padding:17px;margin-bottom:16px}.panel h2{font-size:18px;margin:0 0 4px}.hint{margin:0;color:var(--muted)}.jump{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:13px}.jump a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:var(--gold);border:1px solid #3b507a;border-radius:8px;padding:7px 9px;background:#0a1020;font-weight:700}.jump a:hover{border-color:var(--cyan)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:17px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid #3a4b70;border-radius:999px;background:#0a1020;color:var(--ink);padding:6px 12px;cursor:pointer}.filter.active{color:var(--cyan);border-color:var(--cyan)}input{width:min(360px,100%);border:1px solid #3a4b70;border-radius:9px;background:#09101f;color:var(--ink);padding:9px 12px}.shot{margin:13px 0;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #2d3b5d}.head-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h3{margin:0;font-size:18px}.refs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.type{color:var(--gold);border-color:#806526}.ref{color:var(--cyan);border-color:#35758c;padding:3px 8px}.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}.time{cursor:pointer;color:#d8efff;border:1px solid #52719d;border-radius:6px;padding:2px 7px;font-weight:800}.duration{color:var(--gold);border:1px solid #806526;border-radius:6px;padding:2px 7px;font-weight:800}.meta{color:var(--muted)}.lyrics{margin-top:8px;padding:6px 9px;border-left:3px solid var(--gold);background:#211d17;color:#ffe4a0;font-weight:700}.lyrics.none{border-color:#48516a;background:#101726;color:var(--muted)}.body{padding:16px}.role{color:#f6db7d;font-weight:800;margin-bottom:13px}.prompts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.prompt-label{color:var(--cyan);font-weight:800;display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.prompt{white-space:pre-wrap;margin:0;padding:13px;min-height:230px;border:1px solid #2c416a;border-radius:9px;background:#070c18;font:12px/1.6 ui-monospace,Consolas,monospace}.copy{border:1px solid #5978a7;border-radius:7px;background:#20395e;color:#edf6ff;padding:5px 9px;cursor:pointer}.back{position:fixed;right:24px;bottom:24px;width:46px;height:46px;border:1px solid #5874a0;border-radius:14px;background:#172946;color:#fff;font-size:23px;cursor:pointer}.toast{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:20;padding:10px 22px;border:1px solid var(--cyan);border-radius:10px;background:#112947;color:#fff;font-size:16px;font-weight:800;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}.empty{padding:34px;color:var(--muted);text-align:center}@media(max-width:900px){.jump{grid-template-columns:repeat(2,minmax(0,1fr))}.prompts{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.head-top{flex-direction:column}.refs{justify-content:flex-start}header{padding:28px 20px}main{padding:20px 14px}}
</style></head><body>
<script id="mv-project-data" type="application/json">{}</script><header><div class="eyebrow" id="eyebrow"></div><h1>MiniMax H3 全片分镜提示词｜歌舞表演版</h1><div class="sub" id="sub"></div><div class="metrics" id="metrics"></div></header><main><section class="panel"><h2>分镜快速跳转</h2><p class="hint">点击分镜编号直接定位；每个镜头按其自身 P# 上传顺序，将第 N 张图映射为本镜的 &lt;Picture N&gt;。</p><div class="jump" id="jump"></div></section><section class="panel"><strong style="color:#5ce5f5">MV 表演规则：</strong>独唱镜头在 detailed_description 中写明演唱成员与完整歌词；合唱镜头写明全体演唱；叙事与战斗镜头承载主音频，不声明口型演唱。</section><div class="toolbar"><div class="filters" id="filters"></div><input id="search" placeholder="搜索镜头、角色、场景、动作…"></div><section id="shots"></section></main><button class="back" onclick="scrollTo({top:0,behavior:'smooth'})" title="返回顶部" aria-label="返回顶部">↑</button><div class="toast" id="toast">已复制</div><script>
const PROJECT=JSON.parse(document.getElementById('mv-project-data').textContent||'{}'),S=PROJECT.shots||[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const duration=r=>{let p=t=>{let a=t.split(':');return +a[0]*60+(+a[1])+(+a[2])/1000};let a=r.split('–');return (p(a[1])-p(a[0])).toFixed(1)};function copy(v){navigator.clipboard.writeText(v);$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1100)}
$('#eyebrow').textContent=`《${PROJECT.title||'项目标题'}》 · ${PROJECT.subtitle||'PERFORMANCE MV REF2VA SHOTLIST'}`;$('#sub').textContent=PROJECT.shotlist_note||'歌词、音频切片与提示词以锁定歌词和逐句时间轴为准。';const perf=S.filter(s=>['sing','group','dance','duet'].includes(s.mode)).length;$('#metrics').innerHTML=`<span class="metric"><b>${S.length}</b>&nbsp;个镜头</span><span class="metric"><b>${perf} / ${S.length||0}</b>&nbsp;表演镜头</span><span class="metric"><b>${PROJECT.performance_ratio_note||'待确认'}</b></span><span class="metric"><b>16:9</b>&nbsp;横版 MV</span>`;
$('#jump').innerHTML=S.map(s=>`<a href="#${esc(s.id)}">${esc(s.id)}｜${esc(s.title)}</a>`).join('')||'<div class="empty">在项目清单中填写 shots 后生成页面。</div>';let section='全部';const sections=['全部','Intro / Verse','Pre','Chorus','Bridge / End'];$('#filters').innerHTML=sections.map(x=>`<button class="filter ${x==='全部'?'active':''}" data-section="${x}">${x}</button>`).join('');function matchSection(s){if(section==='全部')return true;let v=(s.section||'').toLowerCase();if(section==='Intro / Verse')return /前奏|主歌|intro|verse/.test(v);if(section==='Pre')return /预副歌|pre/.test(v);if(section==='Chorus')return /副歌|chorus/.test(v);return /桥段|尾奏|结|bridge|end|outro/.test(v)}
function card(s){let refs=(s.references||[]).map(x=>`<span class="ref">${esc(x)}</span>`).join('');let lyric=s.lyrics||'本段无歌词';let none=lyric==='本段无歌词';return `<article class="shot" id="${esc(s.id)}"><div class="head"><div class="head-top"><div><h3>${esc(s.id)}｜${esc(s.title)}</h3><div class="line"><span class="time" data-time="${esc(s.range)}">${esc(s.range)}</span><span class="duration">${duration(s.range)}秒</span><span class="meta">${esc(s.section)} · Ref2VA · 16:9</span></div><div class="lyrics ${none?'none':''}">本段歌词：${esc(lyric)}</div></div><div class="refs"><span class="type">${esc(s.mode||'叙事 / 战斗')}</span>${refs}</div></div></div><div class="body"><div class="role">演唱 / 舞蹈：${esc(s.performer||'剧情镜头')}　音频：${esc(s.audio_slice||s.range||'主歌曲对应切片')}</div><div class="prompts"><div><div class="prompt-label">English H3 prompt · Official Ref2VA <button class="copy" data-copy="${esc(s.prompt_en||'')}">复制提示词</button></div><pre class="prompt">${esc(s.prompt_en||'待填写 English H3 prompt')}</pre></div><div><div class="prompt-label">中文提示词 <button class="copy" data-copy="${esc(s.prompt_zh||'')}">复制提示词</button></div><pre class="prompt">${esc(s.prompt_zh||'待填写中文 H3 提示词')}</pre></div></div></div></article>`}
function draw(){let q=$('#search').value.trim().toLowerCase();let rows=S.filter(s=>matchSection(s)&&(!q||JSON.stringify(s).toLowerCase().includes(q)));$('#shots').innerHTML=rows.map(card).join('')||'<div class="panel empty">没有匹配的分镜。</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>copy(b.dataset.time))}$('#search').oninput=draw;document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',x===b));draw()});draw();
</script><script>
(()=>{const b=document.querySelector('button.back');if(!b)return;b.style.cssText+=';z-index:2147483647;opacity:1;visibility:visible';b.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));const s=document.createElement('style');s.textContent='button.back:hover{border-color:#5ce5f5;transform:translateY(-3px)}@media print{button.back{display:none!important}}';document.head.appendChild(s)})();
</script><script>
(()=>{const p=JSON.parse(document.getElementById('mv-project-data').textContent||'{}');const t=p.page_titles?.h3||'MiniMax H3 全片分镜提示词';document.title=t;const h=document.querySelector('h1');if(h)h.textContent=t})();
</script></body></html>
