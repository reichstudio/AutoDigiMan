<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分镜列表｜歌舞表演版</title><style>
:root{--bg:#060914;--panel:#10172a;--line:#30456d;--ink:#eff6ff;--muted:#aebbd3;--cyan:#5ce5f5;--gold:#ffd36a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font:14px/1.65 Inter,"Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#11172d 0,#0a1020 33vh,#060914 190vh)}header{padding:40px max(32px,calc((100vw - 1160px)/2));background:linear-gradient(90deg,#14213d,#272046 54%,#33224c);border-bottom:1px solid #43517d}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.04em;font-size:17px}h1{margin:4px 0 8px;font-size:clamp(31px,4vw,52px);line-height:1.12}.sub{color:var(--muted);font-size:16px}.metrics{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.metric,.ref{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:#0a1020}.metric b{color:var(--gold)}main{max-width:1160px;margin:0 auto;padding:28px 24px 80px}.panel,.shot{background:rgba(16,23,42,.92);border:1px solid var(--line);border-radius:14px}.panel{padding:17px;margin-bottom:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:17px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid #3a4b70;border-radius:999px;background:#0a1020;color:var(--ink);padding:6px 12px;cursor:pointer}.filter.active{color:var(--cyan);border-color:var(--cyan)}input{width:min(360px,100%);border:1px solid #3a4b70;border-radius:9px;background:#09101f;color:var(--ink);padding:9px 12px}.shot{margin:13px 0;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #2d3b5d}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{margin:0;font-size:18px}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}.time{cursor:pointer;color:#d8efff;border:1px solid #52719d;border-radius:6px;padding:2px 7px;font-weight:800}.duration{color:var(--gold);border:1px solid #806526;border-radius:6px;padding:2px 7px;font-weight:800}.meta{color:var(--muted)}.lyrics{margin-top:8px;padding:6px 9px;border-left:3px solid var(--gold);background:#211d17;color:#ffe4a0;font-weight:700}.lyrics.none{border-color:#48516a;background:#101726;color:var(--muted)}.refs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.ref{color:var(--cyan);border-color:#35758c;padding:3px 8px}.grid{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;padding:17px}.label{color:#f5dc7a;font-weight:800}.value{white-space:pre-wrap}.empty{padding:34px;color:var(--muted);text-align:center}.back{position:fixed;right:24px;bottom:24px;width:46px;height:46px;border:1px solid #5874a0;border-radius:14px;background:#172946;color:#fff;font-size:23px;cursor:pointer}.toast{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:20;padding:10px 22px;border:1px solid var(--cyan);border-radius:10px;background:#112947;color:#fff;font-size:16px;font-weight:800;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}@media(max-width:760px){header{padding:28px 20px}main{padding:20px 14px}.toolbar{align-items:stretch;flex-direction:column}.top{flex-direction:column}.refs{justify-content:flex-start}.grid{grid-template-columns:1fr;gap:3px 0}.label{margin-top:8px}}
</style></head><body>
<script id="mv-project-data" type="application/json">{}</script><header><div class="eyebrow" id="eyebrow"></div><h1>分镜列表｜歌舞表演版</h1><div class="sub" id="sub"></div><div class="metrics" id="metrics"></div></header><main><section class="panel"><strong style="color:#5ce5f5">歌舞 / 剧情比例：</strong><span id="ratio"></span></section><div class="toolbar"><div class="filters" id="filters"></div><input id="search" placeholder="搜索镜头、角色、场景、动作…"></div><section id="shots"></section></main><button class="back" onclick="scrollTo({top:0,behavior:'smooth'})" title="返回顶部" aria-label="返回顶部">↑</button><div class="toast" id="toast">已复制</div><script>
const PROJECT=JSON.parse(document.getElementById('mv-project-data').textContent||'{}'),S=PROJECT.shots||[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const duration=r=>{let p=t=>{let a=t.split(':');return +a[0]*60+(+a[1])+(+a[2])/1000};let a=r.split('–');return (p(a[1])-p(a[0])).toFixed(1)};function copy(v){navigator.clipboard.writeText(v);$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1100)}
$('#eyebrow').textContent=`《${PROJECT.title||'项目标题'}》 · ${PROJECT.subtitle||'CHINESE STORYBOARD REVIEW'}`;$('#sub').textContent=PROJECT.list_note||'全中文审核版：时间、歌词、镜头、动作、连续性与图片引用保持一致。';let perf=S.filter(s=>['sing','group','dance','duet'].includes(s.mode)).length;$('#metrics').innerHTML=`<span class="metric"><b>${S.length}</b>&nbsp;个镜头</span><span class="metric"><b>${perf} / ${S.length||0}</b>&nbsp;歌舞镜头</span><span class="metric"><b>${PROJECT.master_duration_seconds||0}</b>&nbsp;秒完整覆盖</span>`;$('#ratio').textContent=PROJECT.performance_ratio_note||'在项目清单中确认可见歌舞与剧情占比。';let section='全部';const sections=['全部','前奏 / 主歌','预副歌','副歌','桥段 / 尾奏'];$('#filters').innerHTML=sections.map(x=>`<button class="filter ${x==='全部'?'active':''}" data-section="${x}">${x}</button>`).join('');function inSection(s){if(section==='全部')return true;let v=(s.section||'').toLowerCase();if(section==='前奏 / 主歌')return /前奏|主歌|intro|verse/.test(v);if(section==='预副歌')return /预副歌|pre/.test(v);if(section==='副歌')return /副歌|chorus/.test(v);return /桥段|尾奏|结|bridge|end|outro/.test(v)}
function row(label,value){return `<div class="label">${label}</div><div class="value">${esc(value||'待填写')}</div>`}function card(s){let lyric=s.lyrics||'本段无歌词',none=lyric==='本段无歌词',refs=(s.references||[]).map(x=>`<span class="ref">${esc(x)}</span>`).join('');return `<article class="shot"><div class="head"><div class="top"><div><h2>${esc(s.id)}｜${esc(s.title)}</h2><div class="line"><span class="time" data-time="${esc(s.range)}">${esc(s.range)}</span><span class="duration">${duration(s.range)}秒</span><span class="meta">${esc(s.section)}</span></div><div class="lyrics ${none?'none':''}">本段歌词：${esc(lyric)}</div></div><div class="refs">${refs}</div></div></div><div class="grid">${row('表演 / 舞蹈',s.performer||'剧情镜头')}${row('机位与画面动作',s.camera)}${row('场景',s.scene)}${row('画面动作',s.action)}${row('衔接 / 终帧',s.continuity)}${row('引用图片编号',(s.references||[]).join('、'))}</div></article>`}function draw(){let q=$('#search').value.trim().toLowerCase();let rows=S.filter(s=>inSection(s)&&(!q||JSON.stringify(s).toLowerCase().includes(q)));$('#shots').innerHTML=rows.map(card).join('')||'<div class="panel empty">没有匹配的分镜。</div>';document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>copy(b.dataset.time))}$('#search').oninput=draw;document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',x===b));draw()});draw();
</script><script>
(()=>{const b=document.querySelector('button.back');if(!b)return;b.style.cssText+=';z-index:2147483647;opacity:1;visibility:visible';b.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));const s=document.createElement('style');s.textContent='button.back:hover{border-color:#5ce5f5;transform:translateY(-3px)}@media print{button.back{display:none!important}}';document.head.appendChild(s)})();
</script><script>
(()=>{const p=JSON.parse(document.getElementById('mv-project-data').textContent||'{}');const t=p.page_titles?.list||'分镜列表';document.title=t;const h=document.querySelector('h1');if(h)h.textContent=t})();
</script></body></html>
