<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>参考图片清单</title>
<style>
:root{--bg:#060914;--panel:#10172a;--line:#30456d;--ink:#eff6ff;--muted:#aebbd3;--cyan:#5ce5f5;--gold:#ffd36a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font:14px/1.65 Inter,"Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#11172d 0,#0a1020 33vh,#060914 190vh)}header{padding:40px max(32px,calc((100vw - 1220px)/2));background:linear-gradient(90deg,#14213d,#272046 54%,#33224c);border-bottom:1px solid #43517d}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.04em;font-size:17px}h1{margin:4px 0 8px;font-size:clamp(32px,4vw,54px);line-height:1.12}.sub,.hint,.meta{color:var(--muted)}.metrics{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.metric,.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:#0a1020}.metric b,.asset-id{color:var(--gold)}main{max-width:1220px;margin:0 auto;padding:28px 24px 80px}.panel,.card{background:rgba(16,23,42,.9);border:1px solid var(--line);border-radius:14px}.panel{padding:18px;margin-bottom:20px}.panel h2,.card h2{margin:0 0 4px;font-size:18px}.hint{margin:0}.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}.quick a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:var(--cyan);border:1px solid #3b507a;border-radius:8px;padding:7px 9px;background:#0a1020}.quick a:hover{border-color:var(--cyan)}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px}.toolbar input{width:min(360px,100%);border:1px solid #3a4b70;border-radius:9px;background:#09101f;color:var(--ink);padding:9px 12px}.card{margin:14px 0;overflow:hidden}.card-head{padding:14px 16px;border-bottom:1px solid #2d3b5d}.asset-id{font-weight:800}.body{padding:16px;display:grid;grid-template-columns:150px 1fr;gap:8px 16px}.label{color:#f5dc7a;font-weight:800}.value{white-space:pre-wrap}.empty{padding:34px;color:var(--muted);text-align:center}.back{position:fixed;right:24px;bottom:24px;z-index:9999;width:46px;height:46px;border:1px solid #5874a0;border-radius:14px;background:#172946;color:#fff;font-size:23px;cursor:pointer}.back:hover{border-color:var(--cyan);transform:translateY(-3px)}@media print{.back{display:none!important}}@media(max-width:820px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:28px 20px}main{padding:20px 14px}.toolbar{flex-direction:column}.body{grid-template-columns:1fr;gap:3px 0}.label{margin-top:8px}}
</style>
</head>
<body>
<script id="mv-project-data" type="application/json">{}</script>
<header><div class="eyebrow" id="eyebrow"></div><h1 id="page-title">参考图片清单</h1><div class="sub" id="sub"></div><div class="metrics" id="metrics"></div></header>
<main><section class="panel"><h2>图片编号速查</h2><p class="hint">Free 版只登记用户提供的参考图片。P# 是全局稳定编号；点击标签定位对应参考卡。H3 会按每个分镜的上传顺序重新分配本地 &lt;Picture N&gt;。</p><div class="quick" id="quick"></div></section><div class="toolbar"><strong>已提供参考图</strong><input id="search" placeholder="搜索编号、名称、用途…"></div><section id="cards"></section></main>
<button class="back" type="button" title="返回顶部" aria-label="返回顶部">↑</button>
<script>
const PROJECT=JSON.parse(document.getElementById('mv-project-data').textContent||'{}'),A=PROJECT.assets||[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const title=PROJECT.page_titles?.asset||'参考图片清单';document.title=title;$('#page-title').textContent=title;$('#eyebrow').textContent=`《${PROJECT.title||'项目标题'}》 · ${PROJECT.subtitle||'REFERENCE INVENTORY'}`;$('#sub').textContent=PROJECT.asset_note||'用户提供的参考图片登记与 H3 使用映射。';$('#metrics').innerHTML=`<span class="metric"><b>${A.length}</b>&nbsp;项参考图</span><span class="metric"><b>≤9</b>&nbsp;每镜 H3 图上限</span><span class="metric"><b>16:9</b>&nbsp;项目画幅</span>`;$('#quick').innerHTML=A.map(a=>`<a href="#asset-${esc(a.id)}"><b>${esc(a.id)}</b>&nbsp;${esc(a.name)}</a>`).join('');const card=a=>`<article class="card" id="asset-${esc(a.id)}"><div class="card-head"><h2><span class="asset-id">${esc(a.id)}</span> · ${esc(a.asset_id||'REFERENCE')}｜${esc(a.name)}</h2><div class="meta">用户提供参考图</div></div><div class="body"><div class="label">H3 用途</div><div class="value">${esc(a.use||'待指定')}</div><div class="label">资产类型</div><div class="value"><span class="tag">${esc(a.kind||'locked')}</span></div></div></article>`;function render(){const q=$('#search').value.trim().toLowerCase();const items=A.filter(a=>`${a.id} ${a.asset_id} ${a.name} ${a.use}`.toLowerCase().includes(q));$('#cards').innerHTML=items.length?items.map(card).join(''):'<div class="empty">未找到匹配的参考图。</div>'}$('#search').addEventListener('input',render);$('.back').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));render();
</script>
</body></html>
