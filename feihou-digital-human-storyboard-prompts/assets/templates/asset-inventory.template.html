<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资产清单与生成提示词</title><style>
:root{--bg:#060914;--panel:#10172a;--line:#30456d;--ink:#eff6ff;--muted:#aebbd3;--cyan:#5ce5f5;--gold:#ffd36a;--violet:#7653a8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font:14px/1.65 Inter,"Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#11172d 0,#0a1020 33vh,#060914 190vh)}header{padding:40px max(32px,calc((100vw - 1220px)/2));background:linear-gradient(90deg,#14213d,#272046 54%,#33224c);border-bottom:1px solid #43517d}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.04em;font-size:17px}.eyebrow,.asset-id{white-space:nowrap}h1{margin:4px 0 8px;font-size:clamp(32px,4vw,54px);line-height:1.12}.sub{color:var(--muted);font-size:16px}.metrics{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.metric,.chip,.time-pill,.duration{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:#0a1020}.metric b,.asset-id{color:var(--gold)}main{max-width:1220px;margin:0 auto;padding:28px 24px 80px}.panel,.card{background:rgba(16,23,42,.9);border:1px solid var(--line);border-radius:14px}.panel{padding:18px;margin-bottom:20px}.panel h2{margin:0 0 4px;font-size:18px}.hint{margin:0;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}.quick a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:var(--cyan);border:1px solid #3b507a;border-radius:8px;padding:7px 9px;background:#0a1020}.quick a:hover{border-color:var(--cyan)}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px}.toolbar input{width:min(360px,100%);border:1px solid #3a4b70;border-radius:9px;background:#09101f;color:var(--ink);padding:9px 12px}.card{margin:14px 0;overflow:hidden}.card-head{padding:14px 16px;border-bottom:1px solid #2d3b5d}.card h3{margin:0;font-size:18px}.meta{color:var(--muted);margin-top:3px}.body{padding:16px}.prompts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.prompt-label{color:var(--cyan);font-weight:800;display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.prompt{white-space:pre-wrap;min-height:160px;margin:0;padding:13px;border:1px solid #2c416a;border-radius:9px;background:#070c18;font:12px/1.6 ui-monospace,Consolas,monospace}.copy{border:1px solid #5978a7;border-radius:7px;background:#20395e;color:#edf6ff;padding:5px 9px;cursor:pointer}.copy:hover{border-color:var(--cyan)}.empty{padding:34px;color:var(--muted);text-align:center}.back{position:fixed;right:24px;bottom:24px;width:46px;height:46px;border:1px solid #5874a0;border-radius:14px;background:#172946;color:#fff;font-size:23px;cursor:pointer}.toast{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:20;padding:10px 22px;border:1px solid var(--cyan);border-radius:10px;background:#112947;color:#fff;font-size:16px;font-weight:800;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}@media(max-width:820px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.prompts{grid-template-columns:1fr}header{padding:28px 20px}main{padding:20px 14px}}
</style></head><body>
<script id="dh-project-data" type="application/json">{}</script><header><div class="eyebrow" id="eyebrow"></div><h1>资产清单与生成提示词</h1><div class="sub" id="sub"></div><div class="metrics" id="metrics"></div></header><main><section class="panel"><h2>图片编号速查</h2><p class="hint">P# 是全局稳定资产编号；点击标签跳到对应资产卡。生图依赖以 reference_ids 的顺序为准，正文用 @P# 指代来源。H3 分镜另用本地 &lt;Picture N&gt;。</p><p class="hint">只需拖入此 HTML；已有图片通过 file 相对路径引用。图片直接链接原有位置，请保持与 HTML 的相对位置。画布导入器需从 HTML 所在目录读取图片，并按 reference_ids 连线。</p><div class="quick" id="quick"></div></section><div class="toolbar"><strong>资产卡</strong><input id="search" placeholder="搜索编号、名称、用途…"></div><section id="cards"></section></main><button class="back" onclick="scrollTo({top:0,behavior:'smooth'})" title="返回顶部" aria-label="返回顶部">↑</button><div class="toast" id="toast">已复制</div><script>
const PROJECT=JSON.parse(document.getElementById('dh-project-data').textContent||'{}'),A=PROJECT.assets||[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function copy(v){try{await navigator.clipboard.writeText(v);$('#toast').textContent='已复制'}catch(error){$('#toast').textContent='复制失败，请手动选择提示词复制'}$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1100)}
$('#eyebrow').textContent=`《${PROJECT.title||'项目标题'}》 · ${PROJECT.subtitle||'PRODUCTION ASSET BIBLE'}`;$('#sub').textContent=PROJECT.asset_note||'锁定参考、生成资产与双语 GPT Image 2 提示词。';$('#metrics').innerHTML=`<span class="metric"><b>${A.length}</b>&nbsp;项资产</span><span class="metric"><b>16:9</b>&nbsp;横版</span><span class="metric"><b>4K</b>&nbsp;3840×2160</span>`;
$('#quick').innerHTML=A.map(a=>`<a href="#asset-${esc(a.id)}"><span class="asset-id">${esc(a.id)}</span>　${esc(a.name)}</a>`).join('')||'<div class="empty">在项目数据中填写 assets 后生成页面。</div>';

function embeddedFileName(a){return String(a.file||'').startsWith('data:')?'':a.file||''}
function referenceBlock(a){
 const refs=a.reference_ids||[];
 const embedded=String(a.file||'').startsWith('data:image/');
 const file=a.file ? '<div class="meta">'+(embedded?'已内嵌图片：'+esc(a.original_file||a.id):'图片文件：'+esc(a.file))+'</div>'+(a.file?'<img src="'+esc(a.file)+'" alt="'+esc(a.name)+'" loading="lazy" style="display:block;max-width:100%;max-height:240px;margin-top:12px;border-radius:8px;object-fit:contain">':'') : '<div class="meta">'+(a.kind==='locked'?'缺少图片路径':'待生成：尚无图片文件')+'</div>';
 const links=refs.map((id,i)=>{const source=A.find(x=>x.id===id);return '<a class="chip" style="color:var(--cyan)" href="#asset-'+esc(id)+'">'+(i+1)+'. @'+esc(id)+' · '+esc(source?.name||'引用不存在')+(source&&!source.file?' · 待生成上游':'')+'</a>'}).join(' ');
 return file+'<div class="meta">生成此资产的参考图（按上传顺序）：'+(links||'无参考图（独立生成或已有资产）')+'</div>';
}
function draw(){
 const q=$('#search').value.trim().toLowerCase();
 const items=A.filter(a=>!q||[a.id,a.name,a.use,a.original_file,embeddedFileName(a),(a.reference_ids||[]).join(' '),a.prompt_en,a.prompt_zh].join(' ').toLowerCase().includes(q));
 $('#cards').innerHTML=items.map(a=>`<article class="card" id="asset-${esc(a.id)}"><div class="card-head"><h3><span class="asset-id">${esc(a.id)}</span> · ${esc(a.asset_id||a.kind||'ASSET')}｜${esc(a.name)}</h3><div class="meta">${esc(a.use||'')}</div>${referenceBlock(a)}</div><div class="body"><div class="prompts">${['en','zh'].map(lang=>`<div><div class="prompt-label">${lang==='en'?'English prompt':'中文提示词'} ${a['prompt_'+lang]?'<button class="copy" data-asset="'+esc(a.id)+'" data-lang="'+lang+'">复制提示词</button>':''}</div><pre class="prompt">${esc(a['prompt_'+lang]||'锁定参考资产：无需生成提示词。')}</pre></div>`).join('')}</div></div></article>`).join('')||'<div class="panel empty">没有匹配的资产。</div>';
 document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{const a=A.find(x=>x.id===b.dataset.asset);copy(a['prompt_'+b.dataset.lang]||'')});
}
$('#search').oninput=draw;draw();
document.addEventListener('click',e=>{
 const link=e.target.closest('a[href^="#asset-"]');
 if(!link)return;
 e.preventDefault();$('#search').value='';draw();
 const id=link.getAttribute('href').slice(1);
 document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});
});
</script><script>
(()=>{const b=document.querySelector('button.back');if(!b)return;b.style.cssText+=';z-index:2147483647;opacity:1;visibility:visible';b.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));const s=document.createElement('style');s.textContent='button.back:hover{border-color:#5ce5f5;transform:translateY(-3px)}@media print{button.back{display:none!important}}';document.head.appendChild(s)})();
</script><script>
(()=>{const p=JSON.parse(document.getElementById('dh-project-data').textContent||'{}');const t=p.page_titles?.asset||'资产清单与生成提示词';document.title=t;const h=document.querySelector('h1');if(h)h.textContent=t})();
</script></body></html>
