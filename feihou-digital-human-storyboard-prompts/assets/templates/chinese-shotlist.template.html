<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>分镜列表｜数字人口播版</title>
    <style>
      :root {
        --bg: #060914;
        --panel: #10172a;
        --line: #30456d;
        --ink: #eff6ff;
        --muted: #aebbd3;
        --cyan: #5ce5f5;
        --gold: #ffd36a;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        color: var(--ink);
        font:
          14px/1.65 Inter,
          "Microsoft YaHei",
          sans-serif;
        background: linear-gradient(
          180deg,
          #11172d 0,
          #0a1020 33vh,
          #060914 190vh
        );
      }
      header {
        padding: 40px max(32px, calc((100vw - 1160px) / 2));
        background: linear-gradient(90deg, #14213d, #272046 54%, #33224c);
        border-bottom: 1px solid #43517d;
      }
      .eyebrow {
        color: var(--cyan);
        font-weight: 800;
        letter-spacing: 0.04em;
        font-size: 17px;
      }
      h1 {
        margin: 4px 0 8px;
        font-size: clamp(31px, 4vw, 52px);
        line-height: 1.12;
      }
      .sub {
        color: var(--muted);
        font-size: 16px;
      }
      .metrics {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .metric,
      .ref {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 10px;
        background: #0a1020;
      }
      .metric b {
        color: var(--gold);
      }
      main {
        max-width: 1160px;
        margin: 0 auto;
        padding: 28px 24px 80px;
      }
      .panel,
      .shot {
        background: rgba(16, 23, 42, 0.92);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .panel {
        padding: 17px;
        margin-bottom: 16px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 17px 0;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .filter {
        border: 1px solid #3a4b70;
        border-radius: 999px;
        background: #0a1020;
        color: var(--ink);
        padding: 6px 12px;
        cursor: pointer;
      }
      .filter.active {
        color: var(--cyan);
        border-color: var(--cyan);
      }
      input {
        width: min(360px, 100%);
        border: 1px solid #3a4b70;
        border-radius: 9px;
        background: #09101f;
        color: var(--ink);
        padding: 9px 12px;
      }
      .shot {
        margin: 13px 0;
        overflow: hidden;
      }
      .head {
        padding: 14px 16px;
        border-bottom: 1px solid #2d3b5d;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .head h2 {
        margin: 0;
        font-size: 18px;
      }
      .line {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 7px;
      }
      .time-pill {
        cursor: pointer;
        color: #d8efff;
        border: 1px solid #52719d;
        border-radius: 6px;
        padding: 2px 7px;
        font-weight: 800;
      }
      .duration {
        color: var(--gold);
        border: 1px solid #806526;
        border-radius: 6px;
        padding: 2px 7px;
        font-weight: 800;
      }
      .meta {
        color: var(--muted);
      }
      .speech {
        margin-top: 8px;
        padding: 6px 9px;
        border-left: 3px solid var(--gold);
        background: #211d17;
        color: #ffe4a0;
        font-weight: 700;
      }
      .speech.none {
        border-color: #48516a;
        background: #101726;
        color: var(--muted);
      }
      .refs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .ref {
        color: var(--cyan);
        border-color: #35758c;
        padding: 3px 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 8px 16px;
        padding: 17px;
      }
      .media-files {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
        margin: 13px 17px 0;
        padding: 8px 10px;
        border: 1px solid #36537e;
        border-radius: 8px;
        background: #0a1222;
      }
      .media-label {
        color: #aebbd3;
        font-weight: 800;
      }
      .media-file {
        color: #d8efff;
        border: 1px solid #52719d;
        border-radius: 6px;
        padding: 1px 7px;
        font-family: ui-monospace, Consolas, monospace;
      }
      .media-empty {
        color: var(--muted);
      }
      .label {
        color: #f5dc7a;
        font-weight: 800;
      }
      .value {
        white-space: pre-wrap;
      }
      .empty {
        padding: 34px;
        color: var(--muted);
        text-align: center;
      }
      .back {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 46px;
        height: 46px;
        border: 1px solid #5874a0;
        border-radius: 14px;
        background: #172946;
        color: #fff;
        font-size: 23px;
        cursor: pointer;
      }
      .toast {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        padding: 10px 22px;
        border: 1px solid var(--cyan);
        border-radius: 10px;
        background: #112947;
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        opacity: 0;
        pointer-events: none;
        transition: 0.18s;
      }
      .toast.show {
        opacity: 1;
      }
      @media (max-width: 760px) {
        header {
          padding: 28px 20px;
        }
        main {
          padding: 20px 14px;
        }
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }
        .top {
          flex-direction: column;
        }
        .refs {
          justify-content: flex-start;
        }
        .grid {
          grid-template-columns: 1fr;
          gap: 3px 0;
        }
        .label {
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <script id="dh-project-data" type="application/json">
      {}
    </script>
    <header>
      <div class="eyebrow" id="eyebrow"></div>
      <h1>分镜列表｜数字人口播版</h1>
      <div class="sub" id="sub"></div>
      <div class="metrics" id="metrics"></div>
    </header>
    <main>
      <section class="panel">
        <strong style="color: #5ce5f5">时间轴依据：</strong
        ><span id="ratio"></span>
      </section>
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <input id="search" placeholder="搜索镜头、角色、场景、动作…" />
      </div>
      <section id="shots"></section>
    </main>
    <button
      class="back"
      onclick="scrollTo({ top: 0, behavior: 'smooth' })"
      title="返回顶部"
      aria-label="返回顶部"
    >
      ↑
    </button>
    <div class="toast" id="toast">已复制</div>
    <script>
      const PROJECT = JSON.parse(
          document.getElementById("dh-project-data").textContent || "{}",
        ),
        S = PROJECT.shots || [];
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>]/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
          );
      const duration = (r) => {
        let p = (t) => {
          let a = t.split(":");
          return +a[0] * 60 + +a[1] + +a[2] / 1000;
        };
        let a = r.split("–");
        return (p(a[1]) - p(a[0])).toFixed(1);
      };
      function copy(v) {
        navigator.clipboard.writeText(v);
        $("#toast").classList.add("show");
        setTimeout(() => $("#toast").classList.remove("show"), 1100);
      }
      $("#eyebrow").textContent =
        `《${PROJECT.title || "项目标题"}》 · ${PROJECT.subtitle || "CHINESE STORYBOARD REVIEW"}`;
      $("#sub").textContent =
        PROJECT.list_note ||
        "全中文审核版：时间、口播台词、镜头、动作、连续性与图片引用保持一致。";
      let perf = S.filter((s) => ["speak", "demo"].includes(s.mode)).length;
      $("#metrics").innerHTML =
        `<span class="metric"><b>${S.length}</b>&nbsp;个镜头</span><span class="metric"><b>${perf} / ${S.length || 0}</b>&nbsp;出镜口播镜头</span><span class="metric"><b>${PROJECT.master_duration_seconds || 0}</b>&nbsp;秒完整覆盖</span>`;
      $("#ratio").textContent =
        PROJECT.timing_note || "在项目数据中注明时间轴依据（实测或预估）。";
      let section = "全部";
      const sections = [
        "全部",
        "开场 / 引入",
        "要点讲解",
        "演示 / 操作",
        "总结 / 结尾",
      ];
      $("#filters").innerHTML = sections
        .map(
          (x) =>
            `<button class="filter ${x === "全部" ? "active" : ""}" data-section="${x}">${x}</button>`,
        )
        .join("");
      function inSection(s) {
        if (section === "全部") return true;
        let v = (s.section || "").toLowerCase();
        if (section === "开场 / 引入")
          return /开场|引入|开头|intro|opening/.test(v);
        if (section === "要点讲解")
          return /讲解|要点|说明|point|explain/.test(v);
        if (section === "演示 / 操作") return /演示|操作|demo|showcase/.test(v);
        return /总结|结尾|收尾|summary|end|outro/.test(v);
      }
      function row(label, value) {
        return `<div class="label">${label}</div><div class="value">${esc(value || "待填写")}</div>`;
      }
      const asList = (value) =>
        Array.isArray(value) ? value : value ? [value] : [];
      const referencedFiles = (values, catalog) =>
        asList(values)
          .map((value) => {
            const match = (catalog || []).find(
              (item) => item.id === value || item.file === value,
            );
            return match?.file || value;
          })
          .filter(Boolean);
      function mediaFiles(s) {
        const audio = referencedFiles(
          s.audio_refs || s.audio_references || s.voice_reference,
          PROJECT.audio_references,
        );
        const video = referencedFiles(
          s.video_refs || s.video_references,
          PROJECT.video_references,
        );
        const group = (label, files) =>
          files.length
            ? `<span class="media-label">${label}</span>${files.map((file) => `<span class="media-file">${esc(file)}</span>`).join("")}`
            : "";
        return group("引用音频文件：", audio) || group("引用视频文件：", video)
          ? `<div class="media-files">${group("引用音频文件：", audio)}${group("引用视频文件：", video)}</div>`
          : '<div class="media-files"><span class="media-empty">本镜未引用音频或视频文件</span></div>';
      }
      function card(s) {
        let speech = s.speech || "本段无口播",
          none = speech === "本段无口播",
          refs = (s.references || [])
            .map((x) => `<span class="ref">${esc(x)}</span>`)
            .join("");
        return `<article class="shot"><div class="head"><div class="top"><div><h2>${esc(s.id)}｜${esc(s.title)}</h2><div class="line"><span class="time-pill" data-time="${esc(s.range)}">${esc(s.range)}</span><span class="duration">${duration(s.range)}秒</span><span class="meta">${esc(s.section)}</span></div><div class="speech ${none ? "none" : ""}">本段口播：${esc(speech)}</div></div><div class="refs">${refs}</div></div></div>${mediaFiles(s)}<div class="grid">${row("讲者 / 出镜", s.performer || "画外音 / 插入画面")}${row("机位与画面动作", s.camera)}${row("场景", s.scene)}${row("画面动作", s.action)}${row("衔接 / 终帧", s.continuity)}${row("引用图片编号", (s.references || []).join("、"))}</div></article>`;
      }
      function draw() {
        let q = $("#search").value.trim().toLowerCase();
        let rows = S.filter(
          (s) =>
            inSection(s) && (!q || JSON.stringify(s).toLowerCase().includes(q)),
        );
        $("#shots").innerHTML =
          rows.map(card).join("") ||
          '<div class="panel empty">没有匹配的分镜。</div>';
        document
          .querySelectorAll("[data-time]")
          .forEach((b) => (b.onclick = () => copy(b.dataset.time)));
      }
      $("#search").oninput = draw;
      document.querySelectorAll("[data-section]").forEach(
        (b) =>
          (b.onclick = () => {
            section = b.dataset.section;
            document
              .querySelectorAll("[data-section]")
              .forEach((x) => x.classList.toggle("active", x === b));
            draw();
          }),
      );
      draw();
    </script>
    <script>
      (() => {
        const b = document.querySelector("button.back");
        if (!b) return;
        b.style.cssText += ";z-index:2147483647;opacity:1;visibility:visible";
        b.addEventListener("click", () =>
          window.scrollTo({ top: 0, behavior: "smooth" }),
        );
        const s = document.createElement("style");
        s.textContent =
          "button.back:hover{border-color:#5ce5f5;transform:translateY(-3px)}@media print{button.back{display:none!important}}";
        document.head.appendChild(s);
      })();
    </script>
    <script>
      (() => {
        const p = JSON.parse(
          document.getElementById("dh-project-data").textContent || "{}",
        );
        const t = p.page_titles?.list || "分镜列表";
        document.title = t;
        const h = document.querySelector("h1");
        if (h) h.textContent = t;
      })();
    </script>
    <script>
      (() => {
        const project = JSON.parse(
          document.getElementById("dh-project-data").textContent || "{}",
        );
        const style = document.createElement("style");
        style.textContent =
          ".audio-loader{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.audio-loader strong{color:#5ce5f5}.audio-name{min-width:220px;color:#d8e9ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.audio-status{color:#aebbd3;font-size:12px}.audio-picker,.clip-play{border:1px solid #5978a7;border-radius:7px;background:#20395e;color:#edf6ff;cursor:pointer}.audio-picker{padding:7px 10px}.clip-play{width:27px;height:27px;padding:0;font-weight:900;line-height:1}.clip-play:hover,.clip-play.is-playing{border-color:#75ebf7;background:#2b5685;color:#fff}.clip-play.is-playing{color:#ffd36a}@media print{.audio-loader,.clip-play{display:none!important}}";
        document.head.appendChild(style);
        const panel = document.createElement("section");
        panel.className = "panel audio-loader";
        panel.innerHTML =
          '<strong>口播音频载入</strong><span class="audio-name"></span><button class="audio-picker" type="button">选择 / 更换音频</button><input class="audio-file" type="file" accept="audio/*" hidden><span class="audio-status"></span>';
        document.querySelector("main").prepend(panel);
        const audio = document.createElement("audio");
        audio.preload = "metadata";
        document.body.appendChild(audio);
        const name = panel.querySelector(".audio-name"),
          status = panel.querySelector(".audio-status"),
          picker = panel.querySelector(".audio-picker"),
          input = panel.querySelector(".audio-file");
        const toUrl = (value) =>
          /^[a-z]+:\/\//i.test(value)
            ? value
            : /^[A-Za-z]:[\\/]/.test(value)
              ? "file:///" + value.replace(/\\/g, "/")
              : value;
        const fileName = (value) =>
          String(value || "")
            .split(/[\\/]/)
            .pop() || "未载入音频";
        let active = null,
          stopAt = 0,
          blobUrl = "";
        const setButton = (button, playing) => {
          button.textContent = playing ? "■" : "▶";
          button.classList.toggle("is-playing", playing);
          button.setAttribute(
            "aria-label",
            playing ? "停止播放当前片段" : "播放当前片段",
          );
          button.title = playing ? "停止播放" : "播放当前片段";
        };
        const stop = () => {
          audio.pause();
          if (active) setButton(active, false);
          active = null;
          stopAt = 0;
        };
        const seconds = (range) => {
          const value = range.split("–");
          const parse = (time) => {
            const p = time.split(":");
            return Number(p[0]) * 60 + Number(p[1]) + Number(p[2]) / 1000;
          };
          return [parse(value[0]), parse(value[1])];
        };
        const load = (url, label) => {
          stop();
          audio.src = encodeURI(toUrl(url));
          audio.load();
          name.textContent = label;
          status.textContent = "已载入，可播放各分镜音频片段。";
        };
        const defaultAudio = project.master_audio || "";
        if (defaultAudio)
          load(defaultAudio, `默认音频：${fileName(defaultAudio)}`);
        else {
          name.textContent = "尚未载入音频";
          status.textContent = "选择音频后可播放各分镜片段。";
        }
        picker.onclick = () => input.click();
        input.onchange = () => {
          const file = input.files && input.files[0];
          if (!file) return;
          if (blobUrl) URL.revokeObjectURL(blobUrl);
          blobUrl = URL.createObjectURL(file);
          load(blobUrl, `当前音频：${file.name}`);
        };
        const play = (button) => {
          if (active === button) {
            stop();
            return;
          }
          if (!audio.src) {
            status.textContent = "请先选择音频。";
            return;
          }
          stop();
          const [start, end] = seconds(button.dataset.range);
          active = button;
          stopAt = end;
          setButton(button, true);
          const begin = () => {
            audio.currentTime = start;
            audio.play().catch(() => {
              status.textContent = "音频无法播放，请选择本地音频文件。";
              stop();
            });
          };
          if (audio.readyState >= 1) begin();
          else audio.addEventListener("loadedmetadata", begin, { once: true });
        };
        audio.addEventListener("timeupdate", () => {
          if (active && audio.currentTime >= stopAt) stop();
        });
        audio.addEventListener("ended", stop);
        const decorate = () =>
          document.querySelectorAll("[data-time]").forEach((time) => {
            if (
              time.parentElement.querySelector(
                `.clip-play[data-range="${CSS.escape(time.dataset.time)}"]`,
              )
            )
              return;
            const button = document.createElement("button");
            button.type = "button";
            button.className = "clip-play";
            button.dataset.range = time.dataset.time;
            setButton(button, false);
            time.insertAdjacentElement("afterend", button);
          });
        document.getElementById("shots").addEventListener("click", (event) => {
          const button = event.target.closest(".clip-play");
          if (button) play(button);
        });
        new MutationObserver(decorate).observe(
          document.getElementById("shots"),
          { childList: true, subtree: true },
        );
        decorate();
      })();
    </script>
  </body>
</html>
